name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (dependency-ordered)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Start integration services
        env:
          LANYARD_MONGO_PORT: 27017
          LANYARD_REDIS_PORT: 6379
          LANYARD_MINIO_PORT: 9000
          LANYARD_MINIO_CONSOLE_PORT: 9001
          LANYARD_SMTP_PORT: 1025
          LANYARD_MAILPIT_UI_PORT: 8025
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml up -d --wait mongo redis minio mailpit
          docker compose -f infra/docker/docker-compose.dev.yml run --rm minio-setup

      - name: API integration tests
        env:
          MONGODB_URI: mongodb://localhost:27017/lanyard_test?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @lanyard/api test:int

      - name: Stop integration services
        if: always()
        run: docker compose -f infra/docker/docker-compose.dev.yml down --volumes

      - name: Format changed files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- \
              '*.ts' '*.tsx' '*.md' '*.json' '*.yml' '*.yaml'
          )
          if (( ${#files[@]} )); then
            pnpm exec prettier --check "${files[@]}"
          fi

previews:
  generation: off

services:
  - type: keyvalue
    name: lanyard-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: lanyard-api
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @lanyard/contracts build && corepack pnpm --filter @lanyard/api build
    startCommand: corepack pnpm --filter @lanyard/api start
    healthCheckPath: /api/v1/health/ready
    buildFilter:
      paths:
        - 'apps/api/**'
        - 'packages/contracts/**'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'tsconfig.base.json'
        - 'turbo.json'
        - 'render.yaml'
    envVars:
      - key: NODE_ENV
        value: development
      - key: API_GLOBAL_PREFIX
        value: api/v1
      - key: CORS_ORIGINS
        value: https://lanyard-web-store.onrender.com,https://lanyard-web-admin.onrender.com,https://lanyard-web-marketing.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: lanyard-redis
          type: keyvalue
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_BASE_URL
        value: https://api.ng.termii.com
      - key: TERMII_SMS_CHANNEL
        value: generic
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_REQUIRE_TLS
        value: 'false'
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_DEV_PAYMENT_CONFIRM
        value: 'false'

  - type: worker
    name: lanyard-api-worker
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @lanyard/contracts build && corepack pnpm --filter @lanyard/api build
    startCommand: corepack pnpm --filter @lanyard/api start:worker
    buildFilter:
      paths:
        - 'apps/api/**'
        - 'packages/contracts/**'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'tsconfig.base.json'
        - 'turbo.json'
        - 'render.yaml'
    envVars:
      - key: NODE_ENV
        fromService:
          name: lanyard-api
          type: web
          envVarKey: NODE_ENV
      - key: API_GLOBAL_PREFIX
        fromService:
          name: lanyard-api
          type: web
          envVarKey: API_GLOBAL_PREFIX
      - key: JWT_SECRET
        fromService:
          name: lanyard-api
          type: web
          envVarKey: JWT_SECRET
      - key: MONGODB_URI
        fromService:
          name: lanyard-api
          type: web
          envVarKey: MONGODB_URI
      - key: REDIS_URL
        fromService:
          name: lanyard-redis
          type: keyvalue
          property: connectionString
      - key: S3_ENDPOINT
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_ENDPOINT
      - key: S3_REGION
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_REGION
      - key: S3_ACCESS_KEY
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_ACCESS_KEY
      - key: S3_SECRET_KEY
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_SECRET_KEY
      - key: S3_BUCKET
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_BUCKET
      - key: S3_FORCE_PATH_STYLE
        fromService:
          name: lanyard-api
          type: web
          envVarKey: S3_FORCE_PATH_STYLE
      - key: TERMII_API_KEY
        fromService:
          name: lanyard-api
          type: web
          envVarKey: TERMII_API_KEY
      - key: TERMII_SENDER_ID
        fromService:
          name: lanyard-api
          type: web
          envVarKey: TERMII_SENDER_ID
      - key: TERMII_BASE_URL
        fromService:
          name: lanyard-api
          type: web
          envVarKey: TERMII_BASE_URL
      - key: TERMII_SMS_CHANNEL
        fromService:
          name: lanyard-api
          type: web
          envVarKey: TERMII_SMS_CHANNEL
      - key: SMTP_HOST
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_PORT
      - key: SMTP_FROM
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_FROM
      - key: SMTP_SECURE
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_SECURE
      - key: SMTP_REQUIRE_TLS
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_REQUIRE_TLS
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_TLS_REJECT_UNAUTHORIZED
      - key: SMTP_USER
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_USER
      - key: SMTP_PASS
        fromService:
          name: lanyard-api
          type: web
          envVarKey: SMTP_PASS
      - key: PAYSTACK_SECRET_KEY
        fromService:
          name: lanyard-api
          type: web
          envVarKey: PAYSTACK_SECRET_KEY
      - key: PAYSTACK_WEBHOOK_SECRET
        fromService:
          name: lanyard-api
          type: web
          envVarKey: PAYSTACK_WEBHOOK_SECRET
      - key: ENABLE_DEV_PAYMENT_CONFIRM
        fromService:
          name: lanyard-api
          type: web
          envVarKey: ENABLE_DEV_PAYMENT_CONFIRM

  - type: web
    name: lanyard-web-store
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @lanyard/contracts build && corepack pnpm --filter @lanyard/web-store build
    startCommand: corepack pnpm --filter @lanyard/web-store start
    buildFilter:
      paths:
        - 'apps/web-store/**'
        - 'packages/contracts/**'
        - 'scripts/start-next.mjs'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'tsconfig.base.json'
        - 'turbo.json'
        - 'render.yaml'
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: lanyard-api
          type: web
          property: hostport
      - key: API_GLOBAL_PREFIX
        fromService:
          name: lanyard-api
          type: web
          envVarKey: API_GLOBAL_PREFIX
      - key: NEXT_PUBLIC_SUPPORT_PHONE_E164
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_PHONE_DISPLAY
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_WHATSAPP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_HOURS
        value: Daily pharmacy support

  - type: web
    name: lanyard-web-admin
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @lanyard/contracts build && corepack pnpm --filter @lanyard/web-admin build
    startCommand: corepack pnpm --filter @lanyard/web-admin start
    buildFilter:
      paths:
        - 'apps/web-admin/**'
        - 'packages/contracts/**'
        - 'scripts/start-next.mjs'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'tsconfig.base.json'
        - 'turbo.json'
        - 'render.yaml'
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: lanyard-api
          type: web
          property: hostport
      - key: API_GLOBAL_PREFIX
        fromService:
          name: lanyard-api
          type: web
          envVarKey: API_GLOBAL_PREFIX

  - type: web
    name: lanyard-web-marketing
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @lanyard/contracts build && corepack pnpm --filter @lanyard/web-marketing build
    startCommand: corepack pnpm --filter @lanyard/web-marketing start
    buildFilter:
      paths:
        - 'apps/web-marketing/**'
        - 'packages/contracts/**'
        - 'scripts/start-next.mjs'
        - 'package.json'
        - 'pnpm-lock.yaml'
        - 'pnpm-workspace.yaml'
        - 'tsconfig.base.json'
        - 'turbo.json'
        - 'render.yaml'
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: lanyard-api
          type: web
          property: hostport
      - key: API_GLOBAL_PREFIX
        fromService:
          name: lanyard-api
          type: web
          envVarKey: API_GLOBAL_PREFIX
      - key: STORE_URL
        value: https://lanyard-web-store.onrender.com
      - key: NEXT_PUBLIC_STORE_URL
        value: https://lanyard-web-store.onrender.com
      - key: SITE_URL
        value: https://lanyard-web-marketing.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://lanyard-web-marketing.onrender.com
      - key: NEXT_PUBLIC_GA_ID
        sync: false

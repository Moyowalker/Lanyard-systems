name: lanyard-production

x-api-environment: &api-environment
  NODE_ENV: production
  API_GLOBAL_PREFIX: api/v1
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-lanyard}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SENDCHAMP_ACCESS_KEY: ${SENDCHAMP_ACCESS_KEY:?SENDCHAMP_ACCESS_KEY is required}
  SENDCHAMP_SENDER_NAME: ${SENDCHAMP_SENDER_NAME:?SENDCHAMP_SENDER_NAME is required}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  RESEND_FROM_NAME: ${RESEND_FROM_NAME:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?PAYSTACK_SECRET_KEY is required}
  PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:?PAYSTACK_WEBHOOK_SECRET is required}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  caddy:
    <<: *app-defaults
    image: caddy:2.10-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web-store:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      web-marketing:
        condition: service_healthy

  redis:
    <<: *app-defaults
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD" --maxmemory 512mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  api:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/moyowalker/lanyard-systems}/api:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *api-environment
      PORT: 4000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s

  worker:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/moyowalker/lanyard-systems}/api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-environment
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 120s

  web-store:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/moyowalker/lanyard-systems}/web-store:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      API_HOSTPORT: api:4000
      API_GLOBAL_PREFIX: api/v1
      SITE_URL: https://store.lanyardpharmacy.com
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck: &web-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web-admin:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/moyowalker/lanyard-systems}/web-admin:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      API_HOSTPORT: api:4000
      API_GLOBAL_PREFIX: api/v1
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *web-healthcheck

  web-marketing:
    <<: *app-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/moyowalker/lanyard-systems}/web-marketing:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      API_HOSTPORT: api:4000
      API_GLOBAL_PREFIX: api/v1
      SITE_URL: https://lanyardpharmacy.com
      STORE_URL: https://store.lanyardpharmacy.com
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *web-healthcheck

networks:
  internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
